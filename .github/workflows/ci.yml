name: CI

# Push to main reports after the fact — Vercel has already started deploying by
# then. A scratch branch stays silent until a PR is opened. Restricting push to
# main avoids double runs when a branch with an open PR is pushed to.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # No DATABASE_URL here on purpose: the build must not depend on the
      # database being reachable. Build-time queries fall back to empty.
      - name: Build
        run: npm run build

  feature:
    name: Feature tests (real database)
    runs-on: ubuntu-latest
    # Skipped on forks, which cannot read secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A throwaway branch per run. Its endpoint id is new, so guard.ts accepts
      # it, and nothing durable is ever truncated.
      #
      # `parent_branch` is load-bearing: production is the project's DEFAULT
      # branch, so omitting it clones real user data into the branch the tests
      # truncate, in a public repo's logs. The input is `parent_branch` — an
      # undeclared name like `parent` is silently ignored, which is exactly the
      # failure that would go unnoticed.
      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          parent_branch: staging
          branch_name: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # An unset output silently becomes an empty env var, and db.ts would then
      # fall back to .env.test, which does not exist here — the error names a
      # missing file rather than a broken step.
      - name: Check the branch connection resolved
        run: |
          test -n "${{ steps.neon.outputs.db_url }}" || { echo "db_url is empty"; exit 1; }

      # The branch inherits whatever schema staging happens to have. Migrations
      # are additive and idempotent, so running them here keeps the suite from
      # depending on staging being up to date.
      - name: Migrate the branch
        run: node scripts/migrate-ownership-events.mjs
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      # db_url, not db_url_pooled: no endpoint in this project has pooling
      # enabled, so the action emits nothing for the pooled output. A single
      # test process does not need a pooler anyway.
      - name: Feature tests
        run: npm run test:feature
        env:
          TEST_DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      # always() so a failed test still cleans up its branch.
      - name: Delete Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
