name: CI

# Push to main reports after the fact — Vercel has already started deploying by
# then. A scratch branch stays silent until a PR is opened. Restricting push to
# main avoids double runs when a branch with an open PR is pushed to.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One job per check so the run graph names the failure. They repeat their
# setup because Actions has no YAML anchors and a composite action would be
# more indirection than four identical five-line preambles are worth; the npm
# cache makes the repeat cheap.
#
# The jobs are independent on purpose: they all start at once, so a run costs
# about as long as its slowest job. (`needs:` between them would draw a staged
# left-to-right graph and fail fast, at the cost of roughly doubling wall
# clock. Not worth it while the whole run is under two minutes.)
jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # The matrix lives here rather than on every job: the unit suite is ~1s, so
  # fanning it out is nearly free, while a 6-cell build or a 6-cell database
  # job would be six npm installs and six Neon branches for no new signal.
  #
  # windows-latest because that is what this project is developed on, and it is
  # the only way path-separator and CRLF bugs surface before they reach a
  # laptop. ubuntu-latest is what Vercel actually builds on.
  #
  # Node 20 is the floor Next 16 declares (engines: >=20.9.0); 18 is EOL and
  # would fail install. 24 is the forward check.
  unit:
    name: Guard + component tests
    runs-on: ${{ matrix.os }}
    strategy:
      # One red cell should not cancel the others — knowing it fails on Node 24
      # everywhere is different information from it failing only on Windows.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No DATABASE_URL here on purpose: the build must not depend on the
      # database being reachable. Build-time queries fall back to empty.
      - run: npm run build

  feature:
    name: Feature tests (real database)
    runs-on: ubuntu-latest
    # Skipped on forks, which cannot read secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A throwaway branch per run. Its endpoint id is new, so guard.ts accepts
      # it, and nothing durable is ever truncated.
      #
      # `parent` is load-bearing: production is the project's DEFAULT branch, so
      # getting this wrong clones real user data into the branch the tests
      # truncate. The input name is exactly `parent` — an unrecognised name is a
      # warning, not an error, so a typo here fails silently and green.
      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          parent: staging
          branch_name: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # A mistyped `parent` is only a warning, so the branch would quietly come
      # from production instead. Assert the lineage rather than trusting it.
      - name: Check the branch came from staging
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          STAGING_BRANCH_ID: br-steep-dream-ai7mj113
        run: |
          set -euo pipefail
          parent=$(curl -sf \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/${{ secrets.NEON_PROJECT_ID }}/branches" \
            | jq -r --arg n "ci-${{ github.run_id }}" \
                '.branches[] | select(.name==$n) | .parent_id')
          echo "parent_id=$parent"
          if [ "$parent" != "$STAGING_BRANCH_ID" ]; then
            echo "::error::CI branch parent is $parent, expected staging ($STAGING_BRANCH_ID)."
            exit 1
          fi

      # An unset output silently becomes an empty env var, and db.ts would then
      # fall back to .env.test, which does not exist here — the error names a
      # missing file rather than a broken step.
      - name: Check the branch connection resolved
        run: |
          test -n "${{ steps.neon.outputs.db_url }}" || { echo "db_url is empty"; exit 1; }

      # The branch inherits whatever schema staging happens to have. Migrations
      # are additive and idempotent, so running them here keeps the suite from
      # depending on staging being up to date.
      - name: Migrate the branch
        run: node scripts/migrate-ownership-events.mjs
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      # db_url, not db_url_pooled: no endpoint in this project has pooling
      # enabled, so the action emits nothing for the pooled output. A single
      # test process does not need a pooler anyway.
      - name: Feature tests
        run: npm run test:feature
        env:
          TEST_DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      # always() so a failed test still cleans up its branch.
      - name: Delete Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
